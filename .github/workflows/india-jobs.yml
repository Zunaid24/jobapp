name: India job discovery

on:
  push:
    branches:
      - mvp-free-data-pipeline
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  JOBAPP_INGEST_URL: https://jobappmuskan.vercel.app

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stable job source
        run: |
          python -m pip install --upgrade pip
          pip install -U python-jobspy requests
      - name: Discover fresh Goa jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_FRESHNESS_HOURS: "72"
          RESULTS_PER_QUERY: "20"
        run: python scripts/india_job_ingest.py
